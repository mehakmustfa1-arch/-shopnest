<!DOCTYPE html>
<html>
<head><title>ShopNest Login</title></head>
<body style="font-family: Arial; text-align:center; margin-top:50px;">
  <h2>ShopNest - Login / Signup</h2>
  <input id="name" placeholder="Naam (sirf Signup ke liye)" style="padding:10px; margin:5px;"><br>
  <input id="email" placeholder="Email" style="padding:10px; margin:5px;"><br>
  <input id="password" type="password" placeholder="Password" style="padding:10px; margin:5px;"><br><br>
  <button onclick="signup()" style="padding:10px 20px;">Signup</button>
  <button onclick="login()" style="padding:10px 20px;">Login</button>
  <p id="msg"></p>

<script>
async function signup(){
  const res = await fetch('http://localhost:5000/api/auth/signup', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name: document.getElementById('name').value, email: document.getElementById('email').value, password: document.getElementById('password').value })
  });
  const data = await res.json();
  document.getElementById('msg').innerText = data.message;
}
async function login(){
  const res = await fetch('http://localhost:5000/api/auth/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
  });
  const data = await res.json();
  document.getElementById('msg').innerText = data.message;
  if(data.token){ localStorage.setItem('token', data.token); alert('Login Ho Gaya! Token save ho gaya!'); }
}
</script>
</body>
</html>
