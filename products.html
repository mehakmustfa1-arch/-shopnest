<!DOCTYPE html>
<html>
<head>
<title>Products - ShopNest</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
h1{text-align:center}
a{color:#6a00ff}
.grid{display:flex;flex-wrap:wrap;gap:15px;justify-content:center}
.card{background:white;padding:15px;border-radius:10px;width:200px;text-align:center;box-shadow:0 2px 8px #ddd}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
button{background:#6a00ff;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<a href="index.html">⬅ Home</a> | <a href="cart.html">🛒 Cart (<span id="cartCount">0</span>)</a>
<h1>Our Products</h1>
<div class="grid" id="products"></div>

<script>
let products = [
 {id:1, name:"Stylish T-Shirt", price:1200, img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},
 {id:2, name:"Trendy Shoes", price:3500, img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},
 {id:3, name:"Smart Watch", price:5500, img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"},
 {id:4, name:"Hand Bag", price:2800, img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400"},
 {id:5, name:"Headphones", price:4200, img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"},
 {id:6, name:"Sunglasses", price:1500, img:"https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400"}
];

let box = document.getElementById("products");
products.forEach(p => {
 box.innerHTML += `<div class="card">
  <img src="${p.img}">
  <h3>${p.name}</h3>
  <p>Rs. ${p.price}</p>
  <button onclick="addToCart(${p.id})">Add to Cart</button>
 </div>`;
});

function addToCart(id){
 let cart = JSON.parse(localStorage.getItem("cart") || "[]");
 let item = products.find(p=>p.id===id);
 let found = cart.find(c=>c.id===id);
 if(found){ found.qty++; } else { cart.push({...item, qty:1}); }
 localStorage.setItem("cart", JSON.stringify(cart));
 updateCount();
 alert(item.name + " Cart me add ho gaya!");
}
function updateCount(){
 let cart = JSON.parse(localStorage.getItem("cart") || "[]");
 let total = cart.reduce((s,c)=>s+c.qty,0);
 document.getElementById("cartCount").innerText = total;
}
updateCount();
</script>
</body>
</html>
