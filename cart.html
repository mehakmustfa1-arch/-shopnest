<!DOCTYPE html>
<html>
<head>
<title>Cart - ShopNest</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.card{background:white;padding:12px;margin:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
button{padding:5px 10px;border:none;border-radius:5px;cursor:pointer}
.remove{background:#ff3b3b;color:white}
.plus{background:#6a00ff;color:white}
.checkout{background:#00a651;color:white;padding:12px 20px;font-size:16px;margin-top:15px}
</style>
</head>
<body>
<a href="products.html">⬅ Products</a> | <a href="index.html">Home</a>
<h1>🛒 My Cart</h1>
<div id="cartBox"></div>
<h2 id="total"></h2>
<button class="checkout" onclick="checkout()">Checkout - Order Karo</button>

<script>
function showCart(){
 let cart = JSON.parse(localStorage.getItem("cart") || "[]");
 let box = document.getElementById("cartBox");
 let total = 0;
 if(cart.length===0){ box.innerHTML="<p>Cart khaali hai. Pehle Products se add karo.</p>"; document.getElementById("total").innerText=""; return; }
 box.innerHTML="";
 cart.forEach((c,i)=>{
  total += c.price * c.qty;
  box.innerHTML += `<div class="card">
   <div><b>${c.name}</b><br>Rs. ${c.price} x ${c.qty} = Rs. ${c.price*c.qty}</div>
   <div>
    <button class="plus" onclick="changeQty(${i},1)">+</button>
    <button class="plus" onclick="changeQty(${i},-1)">-</button>
    <button class="remove" onclick="removeItem(${i})">Delete</button>
   </div>
  </div>`;
 });
 document.getElementById("total").innerText = "Total: Rs. " + total;
}
function changeQty(i, n){
 let cart = JSON.parse(localStorage.getItem("cart") || "[]");
 cart[i].qty += n;
 if(cart[i].qty<=0) cart.splice(i,1);
 localStorage.setItem("cart", JSON.stringify(cart));
 showCart();
}
function removeItem(i){
 let cart = JSON.parse(localStorage.getItem("cart") || "[]");
 cart.splice(i,1);
 localStorage.setItem("cart", JSON.stringify(cart));
 showCart();
}
function checkout(){
 let cart = JSON.parse(localStorage.getItem("cart") || "[]");
 if(cart.length===0){ alert("Cart khaali hai!"); return; }
 localStorage.setItem("cart", JSON.stringify([]));
 alert("Order ho gaya! Shukriya ❤️");
 window.location.href = "my-orders.html";
}
showCart();
</script>
</body>
</html>
