<!DOCTYPE html>
<html>
<head>
<title>ShopNest - Login / Signup</title>
<style>
body { font-family: Arial; text-align: center; margin-top: 80px; }
input { display: block; margin: 10px auto; padding: 10px; width: 250px; font-size: 16px; }
button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>

<h2>ShopNest - Login / Signup</h2>

<input id="name" type="text" placeholder="Name">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<br>
<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>

<script>
async function signup() {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!name || !email || !password) {
    alert("Pehle naam, email aur password likho!");
    return;
  }

  try {
    const res = await fetch("http://localhost:5000/api/auth/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();
    console.log(data);

    if (res.ok) {
      alert("Signup ho gaya! Ab Login dabao.");
    } else {
      alert(data.message || "Signup fail ho gaya");
    }
  } catch (err) {
    alert("Server band hai! Pehle Terminal me node server.js chalao");
    console.log(err);
  }
}

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Pehle email aur password likho!");
    return;
  }

  try {
    const res = await fetch("http://localhost:5000/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();
    console.log(data);

    if (res.ok) {
      alert("Login ho gaya! Welcome " + (data.user?.name || ""));
      localStorage.setItem("token", data.token);
      window.location.href = "index.html";
    } else {
      alert(data.message || "Login fail ho gaya");
    }
  } catch (err) {
    alert("Server band hai! Pehle Terminal me node server.js chalao");
    console.log(err);
  }
}
</script>

</body>
</html>
