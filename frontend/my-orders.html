<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - ShopNest</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;max-width:800px;margin:0 auto}
a{color:#ff2e88;text-decoration:none;font-weight:bold}
.card{background:#fff;max-width:800px;margin:15px auto;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.badge{background:#fef3c7;color:#92400e;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:bold}
.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
.empty{text-align:center;background:#fff;max-width:800px;margin:30px auto;padding:40px;border-radius:12px}
.delivered{background:#dcfce7;color:#166534}
</style>
</head>
<body>
<div class="top"><h2>🛍️ My Orders</h2><a href="index.html">← Back to Shop</a></div>
<div id="orders"></div>
<script>
const orders = JSON.parse(localStorage.getItem('shopnest_orders') || '[]');
const box = document.getElementById('orders');
if(orders.length === 0){
  box.innerHTML = `<div class="empty"><h3>Abhi koi order nahi hai</h3><p>Pehle shop se kuch order karo.</p><a href="index.html">Shop Now →</a></div>`;
} else {
  box.innerHTML = orders.slice().reverse().map(o => `
  <div class="card">
    <div style="display:flex;justify-content:space-between"><b>Order #${o.id}</b><span class="badge">${o.status}</span></div>
    <p style="color:#666;font-size:14px">${o.date} | ${o.name} | ${o.phone}</p>
    ${o.items.map(i => `<div class="item"><span>${i.name} x ${i.qty}</span><b>Rs ${i.price * i.qty}</b></div>`).join('')}
    <div style="display:flex;justify-content:space-between;margin-top:10px"><span>Address: ${o.address}</span><b>Total: Rs ${o.total}</b></div>
    <p style="font-size:13px;color:#666">Tracking: Order Placed → Packing → Shipped → Delivered</p>
  </div>`).join('');
}
</script>
</body>
</html>
